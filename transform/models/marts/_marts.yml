version: 2

models:
  - name: fct_brand_daily
    description: Gold fact - daily views per brand, incremental with a restatement lookback.
    columns:
      - name: brand_id
        data_tests: [not_null]
      - name: view_date
        data_tests: [not_null]
      - name: views
        data_tests: [not_null]

  - name: fct_share_of_attention
    description: Share of a category's daily pageviews per brand, with 7-day smoothing and WoW.

  - name: fct_buzz_events
    description: Days when a brand's views jumped far above its trailing baseline.

unit_tests:
  - name: buzz_event_is_scored_against_previous_days_only
    description: >
      The spike on day 4 is measured against days 1-3 (mean 11, sd 1). Day 5 is not an
      event: its baseline already contains the spike, which is why the window ends at
      1 preceding rather than at the current row.
    model: fct_buzz_events
    overrides:
      vars:
        buzz_baseline_days: 3
        buzz_z_threshold: 3
    given:
      - input: ref('fct_brand_daily')
        rows:
          - {brand_id: nike, brand_name: Nike, category: sportswear, view_date: 2026-11-01, views: 10}
          - {brand_id: nike, brand_name: Nike, category: sportswear, view_date: 2026-11-02, views: 12}
          - {brand_id: nike, brand_name: Nike, category: sportswear, view_date: 2026-11-03, views: 11}
          - {brand_id: nike, brand_name: Nike, category: sportswear, view_date: 2026-11-04, views: 50}
          - {brand_id: nike, brand_name: Nike, category: sportswear, view_date: 2026-11-05, views: 12}
    expect:
      rows:
        - {brand_id: nike, view_date: 2026-11-04, views: 50, baseline_views: 11, z_score: 39.0}
